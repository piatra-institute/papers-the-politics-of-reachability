abstract: 'Theories of freedom based on non-interference, resources or substantive opportunity do not
  capture the fact that institutions construct the paths by which intentions become consequential action,
  and that these paths, with their costs, risks and gatekeepers, are objects of power. We define freedom
  as reachability, the set of consequential states an agent can attain from its position through existing
  institutional pathways within its budget of money, time, risk and permission and compute it in a simulation.
  In a landscape of 6 pathways permitted to every agent, with a cheap consumption state reachable by all,
  the top budget decile reaches 6 pathways and the bottom five reach none, and the pathway modelled on
  open foundational infrastructure is reachable by 3 deciles of 10. When returns feed back on the landscape,
  the one appropriable pathway deepens and its alternatives silt: over 60 generations the entropy of chosen
  pathways falls from 1.69 bits to 0.21 with no change in law. Capping what returns may do to rival pathways
  preserves their reachability (18 pathway-deciles against 12) while the dominant pathway''s share still
  concentrates. An incumbent spending returns on raising rivals'' costs and capturing a grant office shrinks
  the reachable sets of 5 deciles while every consumer price stays fixed. Shared substrates raise reach
  from 19 to 49 pathway-deciles (open) or 45 (enclosed); after the steward fails, the open substrate retains
  all of its reach and the enclosed platform 0.56, although the platform wins when no one funds maintenance.
  Insurance against failure raises the number of deciles able to attempt any consequential pathway from
  5 to 7.'
web_blurb: 'Freedom as reachability: the consequential states an agent can reach through existing institutional
  pathways. A landscape model shows universal permission with half the population reaching nothing, price-neutral
  landscape power, and why open substrates need funded maintenance.'
