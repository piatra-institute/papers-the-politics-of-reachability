- id: cerf
  kind: source
  passage: Packet internetworking was published as an open protocol by researchers on public contracts
    [@cerf1974].
  evidence:
    citation_id: cerf1974
    locator: Abstract
    verified: true
    verification_note: DOI 10.1109/tcom.1974.1092259; OpenAlex abstract presents a protocol for sharing
      resources across packet-switching networks.
- id: winters-page
  kind: source
  passage: Winters and Page showed that oligarchy is a matter of concentrated material power and coexists
    with elections [@winters2009; @winters2011]; Anderson showed that liberal societies constrain arbitrary
    authority everywhere except inside institutions they classify as private [@anderson2017]; Rawls conceded
    that political liberties lose their fair value under sufficient economic inequality [@rawls1993];
    and Robeyns argued that extreme wealth is objectionable on democratic grounds independent of desert
    [@robeyns2019].
  evidence:
    citation_id: winters2009
    locator: Abstract
    verified: true
    verification_note: DOI 10.1017/S1537592709991770; the abstract uses a material-based definition and
      argues that oligarchy is not inconsistent with democracy.
- id: def-reach
  kind: definition
  passage: 'We define freedom as reachability: the set of consequential states an agent can attain from
    its position through existing pathways within its budget of money, time, risk and permission.'
  rationale: Central stipulative definition.
- id: def-landscape-power
  kind: definition
  passage: 'Landscape power is the dynamic, topological form of the same object: the capacity to alter
    the transition structure through which other agents pursue consequential action, by creating, deleting,
    repricing, gating or freezing pathways.'
  rationale: Defines landscape power as the capacity to alter the transition structure.
- id: def-landscape
  kind: definition
  passage: The landscape is the transition system produced by property and corporate law, finance, intellectual-property
    rules, procurement, standards, credentialing, social insurance and infrastructure; a valley is a viable
    organizational trajectory; a ridge is a barrier of cost, law or legibility; and an attractor is a
    stable form toward which projects converge.
  rationale: Maps Waddington's figure onto institutions.
- id: asm-geometry
  kind: assumption
  passage: The numbers are properties of the model's geometry and make no empirical claim.
  rationale: States the epistemic status of every model number.
- id: asm-choice
  kind: assumption
  passage: The second runs 60 generations in which agents choose affordable pathways by expected value
    and the returns of the appropriable terminal reshape the landscape, deepening the venture pathway
    and, unless capped, raising the costs of its rivals.
  rationale: Expected-value choice and return feedback on costs are modelling assumptions.
- id: int-decile7
  kind: interpretation
  passage: The engineer of the introduction corresponds to decile 7, able to reach the venture, commons
    and cooperative pathways but not the one pathway suited to the project, which exists in law only.
  rationale: Decile 7 reaches venture, commons and cooperative unconditionally (results.json /missing_valley/deciles/6/paths)
    and not open_infra.
- id: int-openinfra-deciles
  kind: interpretation
  passage: The open-infrastructure pathway, permitted to all, is reachable by deciles 8 to 10.
  rationale: results.json /missing_valley/deciles/7-9/paths include open_infra; decile 7 does not.
- id: int-losses
  kind: interpretation
  passage: The reachable sets of 5 deciles shrink, with the largest losses in deciles 7 and 8, while the
    top decile loses one pathway and keeps five.
  rationale: 'results.json /zero_price/reach_by_decile_before and _after: deciles 7 and 8 lose 3 pathways
    each, deciles 6, 9 and 10 lose 1; the manuscript previously said deciles 6 to 8.'
- id: int-fifth
  kind: interpretation
  passage: The venture pathway becomes more accessible as it deepens, admitting a fifth decile that could
    not afford it at the start, so the narrowing is experienced as expanding opportunity.
  rationale: results.json /canalization/unbounded/venture_deciles_first 4 and _last 5.
- id: int-invariants
  kind: interpretation
  passage: Fourteen invariants fail the run if broken, among them the uniformity of permission against
    the steps of reach, the endogenous fall in entropy with no change in law, the cap preserving alternatives
    while the dominant share concentrates, the price-neutral shrinkage of 5 deciles' reachable sets, the
    canalization of both substrates, the forkable world's survival of its steward, the enclosed platform's
    win at zero maintenance, and the dependence of insurance on available pathways.
  rationale: Count of entries in results.json /checks (14).
- id: int-canal
  kind: interpretation
  passage: Both substrates canalize, with at least 0.9 of attempts routed through substrate-based pathways
    (0.97 in the open world and 0.90 in the enclosed one), so TCP/IP is also a canal, and canalization
    as such does not constitute domination.
  rationale: Both substrates canalize; the distinction is forkability.
- id: int-classical
  kind: interpretation
  passage: This configuration, with no interference, universal permission and options everywhere, leaves
    half the population unable to reach any consequential state, and the classical theories cannot register
    it.
  rationale: Interpretive reading of uniform permission with unequal reach.
- id: norm-bounded
  kind: normative
  passage: 'The principle implemented by the model''s cap is bounded landscape power: unlimited improvement
    of one''s own pathway, constrained operations on other people''s pathways, and no actor able to freeze
    the terrain.'
  rationale: Constitutional proposal derived from the cap experiment.
- id: norm-design
  kind: normative
  passage: Keep the foundational layer open and let competition occur above it, the rule most strongly
    supported by the history above and one that European interoperability obligations have begun to legislate
    [@eu2022].
  rationale: Design principle supported by the substrate results and the history.
- id: norm-maintenance
  kind: normative
  passage: The gatekeeper funds maintenance from its tolls, so a polity that wants open foundations without
    funding stewardship has in effect chosen the platform.
  rationale: Policy consequence of the maintenance grid.
runs:
- id: reachability
  required: true
  record: verification/reachability.json
